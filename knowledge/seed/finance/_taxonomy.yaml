# The finance department's knowledge taxonomy (docs/KNOWLEDGE.md section 17). Content: one document per numbered section
# of knowledge/source/finance-research.md (the only source), seeded and scoped exactly like marketing and sales
# (decision 228).
department: finance
label: Finance
seed_version: 1

domains:
  - {id: overview, label: Overview, description: "About this knowledge base (labels, qualifiers, caveats) and what the department is for"}
  - {id: house-style, label: House style, description: "The owner's chosen default style (not evidence): money models as cash-flow design"}
  - {id: precedence, label: Precedence, description: "Law first, evidence second, house style third, collision by collision"}
  - {id: bookkeeping, label: Bookkeeping, description: "Bookkeeping law and standards for a Swedish aktiebolag: BFL, ÅRL, K2 and K3, archiving"}
  - {id: revenue-recognition, label: Revenue recognition, description: "SaaS revenue recognition and capitalised development"}
  - {id: close, label: Close and reporting, description: "Month-end and year-end close, annual report, audit, board duties, equity test"}
  - {id: invoicing, label: Invoicing and receivables, description: "Invoice content, credit notes, payment terms, late payment, Stripe reconciliation, collections"}
  - {id: vat, label: VAT, description: "Moms in Sweden, the EU and beyond: rates, returns, reverse charge, OSS, e-invoicing, ViDA"}
  - {id: tax, label: Tax, description: "Corporate tax, owner taxation (3:12) and R&D incentives"}
  - {id: payroll, label: Payroll, description: "Employer contributions, växa-stöd, AGI, holiday pay, benefits, employee stock options"}
  - {id: calendar, label: Calendar, description: "Recurring dates and deadlines for a Swedish aktiebolag"}
  - {id: planning, label: Planning, description: "Budgeting, rolling forecasts, driver models, scenarios, board packs"}
  - {id: metrics, label: SaaS metrics, description: "Formulas, mistakes and 2025 to 2026 benchmarks"}
  - {id: cash, label: Cash, description: "Cash, working capital, runway, treasury and currency"}
  - {id: pricing, label: Pricing, description: "Pricing and packaging from a finance view"}
  - {id: funding, label: Funding, description: "Valuation, loans, grants, equity, debt and investor reporting"}
  - {id: controls, label: Controls, description: "Financial controls and fraud risk"}
  - {id: ai-in-finance, label: AI in finance, description: "COSO and FRC guidance on AI in the finance function"}
  - {id: guardrails, label: Guardrails, description: "What the department's AI agents may do alone, what needs human approval, what they must never do"}
  - {id: handoffs, label: Handoffs, description: "What Finance receives from and hands over to the other departments"}
  - {id: other-regimes, label: Other regimes, description: "CSRD, UK VAT, DAC7, Pillar Two, US sales tax; and the conclusion"}
  - {id: gaps, label: Gaps, description: "What the knowledge base does not know and what to re-check first"}

platforms: []

objectives:
  - {id: planning, label: Planning}
  - {id: cash, label: Cash}
  - {id: pricing, label: Pricing}
  - {id: compliance, label: Compliance}
  - {id: close, label: Close}
  - {id: billing, label: Billing}
  - {id: metrics, label: Metrics}
  - {id: funding, label: Funding}
  - {id: controls, label: Controls}

