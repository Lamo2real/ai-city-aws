# The retrieval evaluation for the finance knowledge base (docs/KNOWLEDGE.md section 17, decision 228): realistic
# questions a finance agent asks, each with the documents that should appear in the top results. A hit is any expected
# document in the top 5. The tests score it offline (keyword-only); the deploy scores it on the live index.
department: finance
top_k: 5
questions:
  - q: We sell a SaaS subscription from Sweden to a business customer in Germany. Do we charge Swedish VAT, and what goes on the invoice?
    expect: [vat.moms-sweden-eu-and-beyond, invoicing.invoicing-receivables-payment-providers]
  - q: A customer prepaid a 12-month subscription. How and when do we recognise the revenue?
    expect: [revenue-recognition.saas-and-capitalised-development, precedence.law-evidence-house-style]
  - q: What is on the month-end close checklist?
    expect: [close.close-annual-report-audit-board]
  - q: How do we calculate net revenue retention (NRR) and CAC payback?
    expect: [metrics.saas-metrics-formulas-benchmarks]
  - q: How many months of cash runway do we have, and how do we build a 13-week cash forecast?
    expect: [cash.cash-runway-treasury-currency, metrics.saas-metrics-formulas-benchmarks]
  - q: Which dates in the year are the VAT, employer return, income tax and annual report deadlines?
    expect: [calendar.recurring-dates]
  - q: How should we price SIE file exports and which BAS accounts map transfer pricing for a foreign subsidiary?
    expect: [gaps.consolidated-gaps, bookkeeping.law-and-standards, tax.corporate-owner-and-rd-tax]
  - q: When do EU consumer sales pass the EUR 10,000 threshold and require OSS?
    expect: [vat.moms-sweden-eu-and-beyond]
  - q: What are employer contributions in 2026 and when is the monthly AGI employer return due?
    expect: [payroll.payroll-holiday-pay-and-equity, calendar.recurring-dates]
  - q: Can a finance agent release a supplier payment or change a supplier's bank details on its own?
    expect: [guardrails.agent-guardrails, controls.controls-and-fraud-risk]
  - q: Our equity has fallen below half the share capital. What must the board do?
    expect: [close.close-annual-report-audit-board]
  - q: How long must accounting records be archived, and can they be stored in another EU country?
    expect: [bookkeeping.law-and-standards]
  - q: Should we offer a discount for annual prepayment to improve cash flow?
    expect: [house-style.money-models-cash-flow-design, precedence.law-evidence-house-style, cash.cash-runway-treasury-currency]
  - q: What statutory late-payment interest and reminder fee can we charge a business customer who pays late?
    expect: [invoicing.invoicing-receivables-payment-providers]
  - q: How do we reconcile Stripe payouts to the ledger at month-end?
    expect: [invoicing.invoicing-receivables-payment-providers]
  - q: What does Sales need to send Finance, and what does Finance hand back to Sales?
    expect: [handoffs.other-departments]
  - q: What is the corporate tax rate and how does a periodiseringsfond defer tax?
    expect: [tax.corporate-owner-and-rd-tax]
