# The legal department's knowledge taxonomy (docs/KNOWLEDGE.md section 17). Content: one document per numbered
# section of knowledge/source/legal-research.md (the only source), plus "About this knowledge base" (the opening
# summary and "How to read and split this document"); the closing conclusion stays with section 21, consolidated gaps.
# Seeded and scoped exactly like marketing, sales and application (decision 232). "Platforms" are jurisdictions here.
department: legal
label: Legal
seed_version: 1

domains:
  - {id: overview, label: Overview, description: "The opening summary, the labels, the verification statuses and the caveats"}
  - {id: orientation, label: Orientation, description: "The department's job, the regime map and the dates that need action"}
  - {id: contracts, label: Contracts, description: "SaaS and commercial contracts, routine documents (NDAs, DPAs, resellers, consultancy, terms, open source) and AI contract terms"}
  - {id: consumer, label: Consumer terms, description: "Consumer information, withdrawal, renewal and unfair terms"}
  - {id: corporate, label: Corporate, description: "Aktiebolagslagen, registers, options and investment screening"}
  - {id: ip, label: Intellectual property, description: "Copyright, inventions, trade secrets, trademarks, text and data mining"}
  - {id: employment, label: Employment, description: "Swedish employment law"}
  - {id: disputes, label: Disputes, description: "Limitation, deadlines, payment orders, courts and collection"}
  - {id: privacy, label: Privacy, description: "GDPR, Swedish law, IMY practice and cookies"}
  - {id: ai-regulation, label: AI regulation, description: "The EU AI Act as amended and the Swedish supervisory set-up"}
  - {id: digital-regulation, label: Digital regulation, description: "DSA, DMA, Data Act, NIS2, Cyber Resilience Act, accessibility, eIDAS"}
  - {id: marketing-sector, label: Marketing and sectors, description: "Marketing law pointers and finance, health and public-sector add-ons"}
  - {id: financial-crime, label: Sanctions, AML, bribery and competition, description: "Sanctions, export control, AML scope, bribery and competition"}
  - {id: compliance-programme, label: Compliance programme, description: "Policies, accountability, calendar, change tracking and incident clocks"}
  - {id: legal-ops, label: Legal operations, description: "Intake, matters, playbooks, self-service, outside counsel, metrics, tooling"}
  - {id: legal-ai, label: AI in legal work, description: "Evidence on AI accuracy and the professional rules"}
  - {id: guardrails, label: Guardrails, description: "What the department's agents may do alone, what needs human approval, what they must never do"}
  - {id: handoffs, label: Handoffs, description: "Work to and from the other departments"}
  - {id: pending-changes, label: Pending changes, description: "Dated milestones and pending matters; a date already past needs verification"}
  - {id: gaps, label: Gaps, description: "What the knowledge base does not know"}

platforms:
  - {id: sweden, label: Sweden}
  - {id: eu, label: EU}
  - {id: us, label: US}

objectives:
  - {id: contracts, label: Contracts}
  - {id: privacy, label: Privacy}
  - {id: compliance, label: Compliance}
  - {id: people, label: People}
  - {id: governance, label: Governance}
  - {id: disputes, label: Disputes}
  - {id: ip, label: Intellectual property}
  - {id: ai, label: AI}

