# The customer support department's knowledge taxonomy (docs/KNOWLEDGE.md section 17). Content: one document per
# numbered section of knowledge/source/customer-support-research.md (the only source) plus "About this knowledge
# base", seeded and scoped exactly like marketing and sales (decision 229).
department: support
label: Customer support
seed_version: 1

domains:
  - {id: overview, label: Overview, description: "About this knowledge base: the three-layer stack, the claim labels and the caveats"}
  - {id: precedence, label: Precedence, description: "Compliance first, evidence second, house style third, conflict by conflict"}
  - {id: house-style, label: House style, description: "The owner's chosen default style (not evidence): retention, onboarding, usage, cancellation saves, complaints and refunds, price raises, referrals, upsells"}
  - {id: support-model, label: Support model, description: "Channels, tiers and swarming, the help centre"}
  - {id: tickets, label: Tickets, description: "Intake, severity, SLAs, escalation and incidents"}
  - {id: communication, label: Communication, description: "Writing replies, apologies, saying no, abusive contacts"}
  - {id: metrics, label: Metrics, description: "Response and resolution times, CSAT, FCR, cost per contact"}
  - {id: quality, label: Quality, description: "QA scorecards, calibration, grading AI agents"}
  - {id: knowledge-management, label: Knowledge management, description: "KCS, article structure, validation and publishing"}
  - {id: ai-support, label: AI-led support, description: "What AI agents handle, its limits and failure cases"}
  - {id: voice-of-customer, label: Voice of the customer, description: "Support signals, at-risk accounts, feedback to Product"}
  - {id: workforce, label: Workforce, description: "Forecasting, staffing and reviewer capacity"}
  - {id: security, label: Security, description: "Account recovery, identity verification, social engineering"}
  - {id: customer-success, label: Customer success, description: "Retention benchmarks, dunning, health scores, renewals, win-back"}
  - {id: compliance, label: Compliance, description: "Swedish and EU consumer law, B2B obligations, GDPR, accessibility and language, AI disclosure and liability, vulnerable customers and self-harm"}
  - {id: agent-guardrails, label: Agent guardrails, description: "What the department's AI agents may do alone, what needs human approval, what they must never do"}
  - {id: handoffs, label: Handoffs, description: "What support hands to and receives from the other departments"}
  - {id: gaps, label: Gaps, description: "What the knowledge base does not know"}

platforms:
  - {id: email, label: Email}
  - {id: chat, label: Chat}
  - {id: phone, label: Phone}
  - {id: help-center, label: Help centre}
  - {id: social, label: Social media}

objectives:
  - {id: onboarding, label: Onboarding}
  - {id: resolution, label: Resolution}
  - {id: recovery, label: Recovery}
  - {id: retention, label: Retention}
  - {id: cancellation, label: Cancellation}
  - {id: expansion, label: Expansion}
  - {id: advocacy, label: Advocacy}
  - {id: security, label: Security}
  - {id: compliance, label: Compliance}
  - {id: safeguarding, label: Safeguarding}

