# The sales department's knowledge taxonomy (docs/KNOWLEDGE.md section 17). Content: one document per numbered section
# of knowledge/source/sales-research.md (the only source), seeded and scoped exactly like marketing (decision 224).
department: sales
label: Sales
seed_version: 1

domains:
