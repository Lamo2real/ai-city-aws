  - {id: strategy, label: Strategy, description: "Three layers, one funnel, choosing the motion"}
  - {id: house-style, label: House style, description: "The owner's chosen default style (not evidence): mentality, CLOSER, objections, qualification, scripts, pricing, money model, referrals"}
  - {id: precedence, label: Precedence, description: "Compliance first, evidence second, house style third, conflict by conflict"}
