  - {id: methodologies, label: Methodologies, description: "SPIN, Challenger, MEDDICC, Sandler, Gap, JOLT and others"}
  - {id: qualification, label: Qualification, description: "Qualification frameworks and recording unknowns"}
  - {id: conversations, label: Conversations, description: "The evidence on sales conversations"}
  - {id: buyers, label: Buyers, description: "Buyer behaviour in 2025 to 2026"}
  - {id: pipeline, label: Pipeline, description: "Pipeline design and stage exit criteria"}
  - {id: team, label: Team, description: "Roles and team models"}
  - {id: metrics, label: Metrics, description: "Formulas and benchmarks"}
  - {id: management, label: Management, description: "Forecasting, pipeline reviews, CRM hygiene"}
  - {id: post-sale, label: Post-sale, description: "Onboarding, retention, expansion, advocacy and partners"}
  - {id: prospecting, label: Prospecting, description: "Who to pursue, when, and through which warm route"}
  - {id: outbound, label: Outbound, description: "Cold email, cold calling, LinkedIn and multichannel sequences"}
  - {id: inbound, label: Inbound, description: "Inbound lead handling"}
  - {id: ai-in-sales, label: AI in sales, description: "What the evidence supports for AI in sales and what it does not"}
  - {id: compliance, label: Compliance, description: "Outreach law by country, Sweden, recording, EU sales tactics, contracting, bribery, competition, data, and the AI-agent guardrails"}
  - {id: gaps, label: Gaps, description: "What the knowledge base does not know"}

