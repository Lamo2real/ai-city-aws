# The marketing department's knowledge taxonomy. The seeder reads it to validate every entry under this folder
# and to build the graph (Department, Domain, Platform, Objective and Concept vertices). Adding another department
# means adding knowledge/seed/<department>/_taxonomy.yaml and its entries; no code changes.
department: marketing
label: Marketing
seed_version: 1

domains:
  - {id: strategy, label: Strategy, description: "Positioning, audience and ICP, growth, brand versus performance, budgeting"}
  - {id: campaign-planning, label: Campaign planning, description: "Plans, briefs, objectives and KPIs"}
  - {id: measurement, label: Measurement, description: "Unit economics, attribution, incrementality, MMM, experiments, tracking"}
  - {id: meta-ads, label: Meta ads, description: "Facebook and Instagram advertising"}
  - {id: instagram-organic, label: Instagram organic, description: "Organic Instagram"}
  - {id: facebook-organic, label: Facebook organic, description: "Organic Facebook and Groups"}
  - {id: google-ads, label: Google Ads, description: "Search, Performance Max, Demand Gen, Shopping, App"}
  - {id: youtube-ads, label: YouTube ads, description: "YouTube video, Shorts and connected TV advertising"}
  - {id: seo, label: SEO, description: "Technical, content, local, ecommerce and YouTube search"}
  - {id: geo, label: GEO, description: "Visibility in AI answer engines"}
  - {id: tiktok-ads, label: TikTok ads, description: "Paid TikTok"}
  - {id: tiktok-organic, label: TikTok organic, description: "Organic TikTok"}
  - {id: linkedin, label: LinkedIn, description: "LinkedIn paid and organic"}
  - {id: other-platforms, label: Other platforms, description: "Pinterest, Snapchat, Reddit, X and platform choice"}
  - {id: creative, label: Creative, description: "Creative effectiveness, rules, testing and AI creative"}
  - {id: conversion, label: Conversion, description: "Landing pages and conversion rate optimisation"}
  - {id: lifecycle, label: Lifecycle, description: "Email, SMS, messaging, deliverability, flows, loyalty"}
  - {id: content-marketing, label: Content marketing, description: "Content, events, community and digital PR"}
  - {id: creator-marketing, label: Creator marketing, description: "Creators, influencers and UGC"}
  - {id: brand-safety, label: Brand safety, description: "Suitability policy and supply quality"}
  - {id: compliance, label: Compliance, description: "Consent, privacy, ad law, disclosure and AI labelling (EU, Sweden, UK, US)"}
  - {id: market-sweden, label: Sweden, description: "Swedish market data, calendar, payment, delivery and copy norms"}
  - {id: agent-guardrails, label: Agent guardrails, description: "Approval gates and limits for the marketing agents"}

platforms:
  - {id: meta, label: Meta}
  - {id: facebook, label: Facebook}
  - {id: instagram, label: Instagram}
  - {id: whatsapp, label: WhatsApp}
  - {id: google-ads, label: Google Ads}
