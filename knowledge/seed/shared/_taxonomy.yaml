# The shared knowledge taxonomy (docs/KNOWLEDGE.md section 17, decision 238). "shared" is not a department: it is
# the scope every department's managers and workers can retrieve beside their own knowledge base (VAIC, the
# Orchestrator and the executives see no department knowledge, shared included). Content: one document per numbered
# section of knowledge/source/cross-department-handoffs.md (the only source), plus "About this knowledge base" (the
# opening summary and reading guide); the closing conclusion stays with section 10, "Consolidated gaps".
department: shared
label: Shared
seed_version: 1

domains:
  - {id: overview, label: Overview, description: "The opening summary, what each claim label means, and the caveats"}
  - {id: responsibilities, label: Responsibility map, description: "One accountable owner per responsibility and per grey zone"}
  - {id: handoffs, label: Handoff catalogue, description: "Named artefacts, statuses, rejection reasons and time targets between departments"}
  - {id: decision-rights, label: Decision rights, description: "RAPID, DACI, DRI, interaction modes, incident command and escalation"}
  - {id: processes, label: End-to-end processes, description: "Lead-to-cash, idea-to-launch, issue-to-resolution and the other company processes, step by step"}
  - {id: rhythms, label: Rhythms and metrics, description: "The weekly business review, metric owners and one definition per metric"}
  - {id: coordination, label: Multi-agent coordination, description: "Orchestration patterns, handoff messages, protocols, failure modes, audit, cost and evaluation"}
  - {id: routing, label: Routing and message template, description: "Manager-to-manager versus worker-to-worker, and the handoff message fields"}
  - {id: guardrails, label: Company-wide guardrails, description: "Human approval for pay, sign, publish, deploy and grant-access, and the three tiers"}
  - {id: compliance, label: Sweden and EU, description: "The verified legal anchors and the unresearched Swedish layer"}
  - {id: gaps, label: Gaps, description: "What the research did not verify or could not find, and the conclusion"}

platforms: []

objectives:
  - {id: ownership, label: Clear ownership}
  - {id: handoffs, label: Reliable handoffs}
  - {id: safety, label: Safety and approval}
  - {id: compliance, label: Compliance}

