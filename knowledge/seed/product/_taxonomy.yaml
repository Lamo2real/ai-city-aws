# The product department's knowledge taxonomy (docs/KNOWLEDGE.md section 17). Content: one document per numbered
# section of knowledge/source/product-research.md (the only source), plus "About this knowledge base" (the opening
# summary and reading guide); the closing conclusion stays with section 24 (consolidated gaps). Seeded and scoped
# exactly like marketing, sales and application (decision 230).
department: product
label: Product
seed_version: 1

domains:
  - {id: overview, label: Overview, description: "The opening summary, the labels and caveats, and how the department decides and works"}
  - {id: house-style, label: House style, description: "Hormozi's product-relevant models and their adaptation to software (the owner's default, not evidence)"}
  - {id: precedence, label: Precedence, description: "Compliance first, evidence second, house style third, and the known collisions"}
  - {id: strategy, label: Strategy, description: "Strategy, segments, positioning, competition, build or buy, product-market fit"}
  - {id: discovery, label: Discovery, description: "Opportunity solution trees, jobs-to-be-done, interviews, assumption tests, prototypes"}
  - {id: prioritisation, label: Prioritisation and roadmaps, description: "Scoring models, opportunity assessment, now-next-later, saying no, stakeholders"}
  - {id: delivery, label: Specification and delivery, description: "One-pagers, user stories, acceptance criteria, feature flags, betas and rollouts"}
  - {id: metrics, label: Metrics and experimentation, description: "North star, metric trees, HEART, activation, retention, adoption, A/B tests"}
  - {id: go-to-market, label: Go-to-market and pricing, description: "Launch tiers, pricing models, AI pricing, packaging, trials, product-qualified leads"}
  - {id: operating-model, label: Operating model, description: "Team models, OKRs, product ops and the product role after agentic AI"}
  - {id: ai-products, label: AI products, description: "Building and evaluating AI features and designing AI and agent experiences"}
  - {id: ux, label: UX and design, description: "Usability heuristics, forms, design process, design systems and measuring UX"}
  - {id: research, label: User research, description: "Methods, sample sizes, synthetic users, AI-moderated interviews, synthesis"}
  - {id: accessibility, label: Accessibility, description: "WCAG 2.2 AA, EN 301 549, the European Accessibility Act and the Swedish act (orientation, not legal advice)"}
  - {id: compliance, label: Compliance, description: "Compliance by design and the Swedish and EU rules in one place (orientation, not legal advice)"}
  - {id: localisation, label: Localisation and content, description: "Internationalisation, Swedish formats, content design and mandated wording"}
  - {id: guardrails, label: Guardrails, description: "What the department's agents may do alone, what needs human approval, what they must never do"}
  - {id: handoffs, label: Handoffs, description: "Work to and from the other departments, and escalation to Legal"}
  - {id: gaps, label: Gaps, description: "What the knowledge base does not know"}

platforms:
  - {id: web, label: Web}
  - {id: ios, label: iOS}
  - {id: android, label: Android}
  - {id: figma, label: Figma}

objectives:
  - {id: discover, label: Discover}
  - {id: prioritise, label: Prioritise}
  - {id: launch, label: Launch}
  - {id: grow, label: Grow}
  - {id: retain, label: Retain}
  - {id: compliance, label: Compliance}
  - {id: measurement, label: Measurement}

