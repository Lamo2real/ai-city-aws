# The operations department's knowledge taxonomy (docs/KNOWLEDGE.md section 17). Content: one document per numbered
# section of knowledge/source/operations-research.md (the only source), plus "About this knowledge base" (the opening
# summary and reading guide); section 2 (house style) is two documents because it is longer than one document may be,
# and the closing conclusion stays with section 26 (consolidated gaps). Seeded and scoped exactly like marketing,
# sales and application (decision 234).
department: operations
label: Operations
seed_version: 1

domains:
  - {id: overview, label: Overview, description: "The opening summary, the labels and caveats, and the department's three-layer rule"}
  - {id: house-style, label: House style, description: "The owner's chosen default style (not evidence): Alex and Leila Hormozi's operating models"}
  - {id: precedence, label: Precedence, description: "Law first, evidence second, house style third, and the collision table"}
  - {id: processes, label: Process management, description: "SIPOC, SOPs, checklists, PDCA, DMAIC, the five focusing steps, automation"}
  - {id: rhythm, label: Operating rhythm, description: "OKRs, EOS, 4DX, meetings, RAPID, DACI, RACI and decision records"}
  - {id: projects, label: Projects, description: "PMBOK, PRINCE2, reference-class estimation, project templates"}
  - {id: service-levels, label: Service levels and capacity, description: "SLI, SLO, SLA, queueing and capacity planning"}
  - {id: vendors, label: Vendors and procurement, description: "SaaS estate, AI pricing, GDPR Article 28 contracts, MBL, vendor templates"}
  - {id: risk, label: Risk, continuity and quality, description: "ISO 31000, quality, business continuity, AI Act risk"}
  - {id: organisation, label: Organisation design, description: "Span of control, async work, reorganising in Sweden"}
  - {id: business-systems, label: Business systems, description: "Systems of record and revenue operations"}
  - {id: ai-operations, label: AI operations, description: "Operating a company with AI agents in 2026"}
  - {id: hiring, label: Hiring, description: "Selection evidence, structured interviews, Swedish hiring law, the pipeline"}
  - {id: onboarding, label: Onboarding, description: "Statutory first-week deadlines, evidence, checklist"}
  - {id: performance, label: Performance, description: "Evidence, Swedish limits, a light performance cycle"}
  - {id: compensation, label: Compensation and benefits, description: "Pay survey, pay transparency, pension, insurance, benefits"}
  - {id: offboarding, label: Offboarding, description: "LAS, redundancy, final pay, offboarding checklist"}
  - {id: compliance, label: Compliance, description: "Swedish employment, work-environment, employee-data and AI-in-people-decisions law (orientation, not legal advice)"}
  - {id: contractors, label: Contractors and international teams, description: "Contractor or employee, permits, foreign staff, hiring abroad"}
  - {id: calendar, label: Handbook and calendar, description: "Mandatory written items, annual duties, handbook, people-operations calendar"}
  - {id: guardrails, label: Guardrails, description: "What the department's agents may do alone, what needs human approval, what they must never do"}
  - {id: handoffs, label: Handoffs, description: "Work to and from the other departments"}
  - {id: gaps, label: Gaps, description: "What the knowledge base does not know"}

platforms: []

objectives:
  - {id: scale, label: Scale}
  - {id: efficiency, label: Efficiency}
  - {id: people, label: People}
  - {id: compliance, label: Compliance}
  - {id: reliability, label: Reliability}
  - {id: cost, label: Cost}

