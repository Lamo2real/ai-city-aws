# The research department's knowledge taxonomy (docs/KNOWLEDGE.md section 17). Content: one document per numbered
# section of knowledge/source/research-dept-research.md (the only source) plus "About this knowledge base" (the title,
# opening summary and reading guide); the closing Conclusion stays with section 20. Seeded and scoped exactly like
# marketing and sales (decision 231).
department: research
label: Research
seed_version: 1

domains:
  - {id: overview, label: Overview, description: "The overall position, what each claim label means, the legal verification qualifiers and the caveats"}
  - {id: design, label: Research design, description: "The Aqua Book specification, gates before new research, choosing a method, stopping rules"}
  - {id: desk-research, label: Desk research, description: "Evaluating sources, lateral reading, tracing claims to origin, search strategy"}
  - {id: data-sources, label: Public data sources, description: "Swedish, EU and international registers and statistics, access limits and reuse"}
  - {id: market, label: Market analysis and forecasting, description: "Market sizing, industry structure, scenarios, forecasting from the reference class"}
  - {id: competitive-intelligence, label: Competitive intelligence, description: "Ethical baseline, trade-secret and competition law, competitor profiles, win/loss"}
  - {id: surveys, label: Surveys and interviews, description: "Questionnaire design, sampling, fraud and AI responses, disclosure, interviews, pricing research"}
  - {id: analysis, label: Analysis, description: "Statistical inference, qualitative and mixed methods, assumptions and sensitivity"}
  - {id: reporting, label: Reporting, description: "Probability language, confidence, report contents, charts, audit trail"}
  - {id: academic-tech, label: Academic and technology research, description: "Systematic and rapid reviews, papers and preprints, technology readiness, patents"}
  - {id: operations, label: Research operations, description: "The repository, roles, governance, intake, impact, sunset dates"}
  - {id: ai-research, label: AI-assisted research, description: "Citation fidelity, failure modes, verification, multi-agent workflows, scholarly APIs, robots.txt"}
  - {id: compliance, label: Compliance, description: "Copyright and text-and-data mining, web scraping, personal data, Swedish ethics review (orientation for a human to confirm)"}
  - {id: integrity, label: Research integrity, description: "Disclosure of AI use, sources, limits and interests"}
  - {id: security, label: Confidential information, description: "Queries are disclosures, fetched pages are untrusted"}
  - {id: guardrails, label: Guardrails, description: "What the department's agents may do alone, what needs human approval, what they must never do"}
  - {id: handoffs, label: Handoffs, description: "What Research receives from and hands to the other departments"}
  - {id: gaps, label: Gaps, description: "What the knowledge base does not know, and the conclusion"}

platforms:
  - {id: web, label: Open web}
  - {id: official-registers, label: Official registers and statistics}
  - {id: scholarly-apis, label: Scholarly APIs}
  - {id: survey-panels, label: Survey panels}

objectives:
  - {id: decision-quality, label: Decision quality}
  - {id: evidence, label: Evidence}
  - {id: communication, label: Communication}
  - {id: compliance, label: Compliance}

