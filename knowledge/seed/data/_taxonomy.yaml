# The Data and AI department's knowledge taxonomy (docs/KNOWLEDGE.md section 17). Content: one document per
# numbered section of knowledge/source/data-and-ai-research.md (the only source), seeded and scoped exactly like
# marketing and sales (decision 227). The folder is the department key in config/departments.json ("data").
department: data
label: Data and AI
seed_version: 1
domains:
- id: overview
  label: Overview
  description: What the labels mean and the caveats that apply to everything
- id: architecture
  label: Data architecture
  description: Lakehouse, table formats, catalogues, layering, batch and streaming
- id: modelling
  label: Data modelling
  description: Dimensional marts, grain, slowly changing dimensions, dbt models, semantic layer
- id: pipelines
  label: Pipelines
  description: Orchestration, idempotent loads, backfills, contracts and tests
- id: quality
  label: Data quality
  description: Quality dimensions, tests, SLOs, lineage and data incidents
- id: governance
  label: Data governance
  description: Ownership, data mesh, tag-based access and the governance kit
- id: privacy
  label: Privacy engineering
  description: Pseudonymisation, anonymisation, GDPR in pipelines, the Data Act, residency
- id: analytics
  label: Analytics and experimentation
  description: Metrics, A/B tests, sample ratio mismatch, forecasting
- id: stores
  label: Graph and vector stores
  description: Neptune, OpenSearch and other stores as knowledge for client and product work
- id: ml
  label: Machine learning and MLOps
  description: Baselines, the ML lifecycle, model registry, drift
- id: llm
  label: LLM engineering
  description: Model choice, routing, context, tools, caching, fine-tuning versus RAG
- id: rag
  label: RAG and retrieval
  description: Hybrid retrieval, chunking, rerankers, graph RAG, access filters, evaluation
- id: agents
  label: Agents
  description: Multi-agent evidence, orchestration, memory, MCP and A2A
- id: data-agents
  label: Data agents
  description: Text-to-SQL and semantic-layer grounding
- id: evaluation
  label: Evaluation
  description: Eval sets, LLM judges, regression tests
- id: security
  label: AI security
  description: Prompt injection, OWASP, layered controls
- id: ai-law
  label: AI governance and law
  description: EU AI Act, GDPR and AI, standards, Sweden (orientation, not legal advice)
- id: responsible-ai
  label: Responsible AI
  description: Documentation, fairness testing, oversight, incidents
- id: cost
  label: Cost and FinOps
  description: Managed versus self-hosted, cost limits, FinOps, operating model
- id: guardrails
  label: Guardrails
  description: What agents may do alone, what needs human approval, what they must never do
- id: handoffs
  label: Handoffs
  description: What Data and AI hands to and receives from other departments
- id: gaps
  label: Gaps
  description: What the knowledge base does not know
