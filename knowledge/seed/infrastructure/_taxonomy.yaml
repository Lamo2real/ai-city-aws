# The IT infrastructure department's knowledge taxonomy (docs/KNOWLEDGE.md section 17). Content: one document per
# numbered section of knowledge/source/it-infrastructure-research.md (the only source) plus "About this knowledge
# base", seeded and scoped exactly like marketing and sales (decision 226). The folder is the department key,
# `infrastructure` (shown as IT Infrastructure).
department: infrastructure
label: IT infrastructure
seed_version: 1

domains:
  - {id: overview, label: Overview, description: "The overall position, what each claim label means, the legal-source qualifiers and the caveats"}
  - {id: operating-model, label: Operating model, description: "The department as a platform team with hard gates"}
  - {id: aws, label: AWS architecture, description: "Accounts, SCPs, Control Tower, networking, compute, databases, OpenSearch, Neptune, EU Regions, sovereign cloud"}
  - {id: iac, label: Infrastructure as code, description: "Terraform or OpenTofu, state, CDK, pipelines, configuration as change, GitOps and drift"}
  - {id: platform, label: Platform engineering, description: "The internal platform as a product"}
  - {id: compute, label: Kubernetes and serverless, description: "Kubernetes, EKS versions and data planes, Lambda limits"}
  - {id: reliability, label: Reliability and recovery, description: "Error budgets, disaster recovery, failover, recovery tiers, immutable backups, the 2025 and 2026 outages"}
  - {id: incidents, label: Incident management, description: "On-call, roles, severity, postmortems, communication, runbooks"}
  - {id: observability, label: Observability, description: "Burn-rate alerting, OpenTelemetry, deployment-safety alarms, telemetry cost"}
  - {id: change, label: Change management, description: "Approval models, delivery metrics, progressive deployment, the change policy"}
  - {id: finops, label: Cost management, description: "FinOps, Savings Plans, tagging, AI and GPU cost"}
  - {id: security, label: Security, description: "Security architecture and post-quantum cryptography"}
  - {id: compliance, label: Compliance, description: "Security frameworks and certifications; EU and Swedish regulation (orientation for a human to confirm)"}
  - {id: itsm, label: IT service management, description: "ITIL, ownership roles, service desk, configuration records"}
  - {id: corporate-it, label: Corporate IT, description: "Workforce identity, devices, joiner-mover-leaver, SaaS, email authentication, continuity"}
  - {id: ai-agents, label: AI agents, description: "Published guidance and incidents for agents that operate infrastructure"}
  - {id: guardrails, label: Guardrails, description: "What the department's agents may do alone, with a named human's approval, and never"}
  - {id: handoffs, label: Hand-offs, description: "What IT infrastructure receives from and hands to the other departments"}
  - {id: gaps, label: Gaps, description: "What the knowledge base does not know, and the conclusion"}

platforms:
  - {id: aws, label: AWS}
  - {id: terraform, label: Terraform and OpenTofu}
  - {id: kubernetes, label: Kubernetes}

objectives:
  - {id: reliability, label: Reliability}
  - {id: security, label: Security}
  - {id: cost, label: Cost}
  - {id: compliance, label: Compliance}
  - {id: delivery, label: Delivery}

