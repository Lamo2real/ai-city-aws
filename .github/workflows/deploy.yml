# Deploy prod. Started by hand only (workflow_dispatch), from main only. The owner provides just two
# repository variables: AIC_DEPLOY_ROLE_ARN (an IAM role GitHub can assume through OIDC, see
# docs/DEPLOY_CHECKLIST.md for its trust policy) and AIC_OWNER_EMAIL. Optional: AIC_REGION
# (default eu-north-1) and AIC_MONTHLY_BUDGET_USD (alert amount, default 10000).
#
# One run deploys from nothing:
#   plan     - tests, builds the Lambdas, creates the Terraform state bucket if it is missing, plans.
#   apply    - waits for the owner's approval on the `production` environment, then applies exactly the
#              reviewed plan. The plan itself builds and pushes the agent image (scripts/push-image.sh)
#              after the ECR repository exists and before the runtimes.
#   frontend - uploads the HUD to its bucket and refreshes CloudFront, using Terraform's outputs.
name: deploy
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy prod" to run
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AIC_REGION || 'eu-north-1' }}
  TF_IN_AUTOMATION: "1"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'deploy prod'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      state_bucket: ${{ steps.state.outputs.bucket }}
    steps:
      - name: check the repository variables
        env:
          ROLE: ${{ vars.AIC_DEPLOY_ROLE_ARN }}
          EMAIL: ${{ vars.AIC_OWNER_EMAIL }}
        run: |
          missing=""
          [ -n "$ROLE" ] || missing="$missing AIC_DEPLOY_ROLE_ARN"
          [ -n "$EMAIL" ] || missing="$missing AIC_OWNER_EMAIL"
          if [ -n "$missing" ]; then
            echo "::error::Set these in GitHub → Settings → Secrets and variables → Actions → Variables:$missing"
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w @aic/lambdas
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AIC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform state bucket (created on the first run)
        id: state
        run: bash scripts/ensure-state-bucket.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: terraform plan
        working-directory: infra/envs/prod
        env:
          STATE_BUCKET: ${{ steps.state.outputs.bucket }}
          OWNER_EMAIL: ${{ vars.AIC_OWNER_EMAIL }}
          BUDGET: ${{ vars.AIC_MONTHLY_BUDGET_USD || '10000' }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -input=false -out=prod.tfplan \
            -var "region=${AWS_REGION}" \
            -var "owner_email=${OWNER_EMAIL}" \
            -var "agent_image_tag=${IMAGE_TAG}" \
            -var "monthly_budget_usd=${BUDGET}"
          terraform show -no-color prod.tfplan > plan.txt
          {
            echo "## Terraform plan"
            grep -E '^Plan:|No changes' plan.txt || true
            echo
            echo "Read plan.txt in the prod-plan artifact, then approve the production environment."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: prod-plan
          include-hidden-files: true
          path: |
            infra/envs/prod/prod.tfplan
            infra/envs/prod/plan.txt
            infra/envs/prod/.build
            services/lambdas/dist
          retention-days: 3

  apply:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production # the owner approves here, after reading plan.txt
    permissions:
      contents: read
      id-token: write
    outputs:
      hud_bucket: ${{ steps.out.outputs.hud_bucket }}
      distribution_id: ${{ steps.out.outputs.distribution_id }}
      hud_url: ${{ steps.out.outputs.hud_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: prod-plan
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AIC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      # The plan builds the ARM64 agent image while it applies (scripts/push-image.sh).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: terraform apply (the reviewed plan, exactly)
        working-directory: infra/envs/prod
        env:
          STATE_BUCKET: ${{ needs.plan.outputs.state_bucket }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=prod/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform apply -input=false prod.tfplan
      - name: outputs for the HUD upload
        id: out
        working-directory: infra/envs/prod
        run: |
          echo "hud_bucket=$(terraform output -raw hud_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "hud_url=$(terraform output -raw hud_url)" >> "$GITHUB_OUTPUT"

  frontend:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @aic/web
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AIC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: upload the HUD (config.json is managed by Terraform) and refresh CloudFront
        env:
          BUCKET: ${{ needs.apply.outputs.hud_bucket }}
          DIST: ${{ needs.apply.outputs.distribution_id }}
          URL: ${{ needs.apply.outputs.hud_url }}
        run: |
          aws s3 sync web/dist "s3://${BUCKET}" --delete --exclude config.json --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/dist/index.html "s3://${BUCKET}/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${DIST}" --paths "/index.html" "/"
          echo "## AI City is deployed: ${URL}" >> "$GITHUB_STEP_SUMMARY"
