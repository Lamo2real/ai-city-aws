# Deploy prod. Runs automatically on every push to main (the owner's choice: no approval step), and can
# also be started by hand. Docs-only pushes don't deploy. The owner provides:
#   variable AIC_DEPLOY_ROLE_ARN  an IAM role GitHub can assume through OIDC (trust: docs/deploy-role-trust-policy.json)
#   secret   AIC_OWNER_EMAIL      the only login (Cognito, admin-created) and where alerts go. A secret, not a
#                                 variable, so it is masked in the logs of this public repository.
# Optional variables: AIC_REGION (default eu-north-1), AIC_MONTHLY_BUDGET_USD (alert amount, default 10000),
# AIC_STATE_BUCKET (default lamo-labs-state-bucket; state key ai-city-aws/prod/terraform.tfstate).
#
# One run deploys from nothing:
#   plan     - tests, builds the Lambdas, creates the Terraform state bucket if it is missing, plans.
#   apply    - applies exactly that plan (no approval). The plan builds and pushes the agent image
#              (scripts/push-image.sh) after the ECR repository exists and before the runtimes. The image
#              tag is a hash of the runtime's sources, so pushes that don't touch them don't rebuild it.
#   frontend - uploads the HUD to its bucket and refreshes CloudFront, using Terraform's outputs.
# A push whose commit message contains [skip ci] does not deploy.
name: deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AIC_REGION || 'eu-north-1' }}
  TF_STATE_BUCKET: ${{ vars.AIC_STATE_BUCKET || 'lamo-labs-state-bucket' }}
  TF_STATE_KEY: ai-city-aws/prod/terraform.tfstate
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      state_bucket: ${{ steps.state.outputs.bucket }}
      state_region: ${{ steps.state.outputs.region }}
    steps:
      - name: check the repository settings
        env:
          ROLE: ${{ vars.AIC_DEPLOY_ROLE_ARN }}
          EMAIL: ${{ secrets.AIC_OWNER_EMAIL }}
        run: |
          ok=1
          [ -n "$ROLE" ] || { echo "::error::Set the variable AIC_DEPLOY_ROLE_ARN (Settings → Secrets and variables → Actions → Variables)."; ok=0; }
          [ -n "$EMAIL" ] || { echo "::error::Set the secret AIC_OWNER_EMAIL (Settings → Secrets and variables → Actions → Secrets)."; ok=0; }
          [ "$ok" = 1 ]
      - uses: actions/checkout@v5
      - name: agent image tag (changes only when the runtime's sources change)
        id: image
        run: |
          h="${{ hashFiles('services/agent-runtime/**', 'packages/shared/**', 'agents/**', 'config/**', 'package-lock.json', 'package.json') }}"
          echo "tag=rt-${h:0:16}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w @aic/lambdas
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AIC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform state bucket (created on the first run if missing)
        id: state
        env:
          STATE_BUCKET: ${{ env.TF_STATE_BUCKET }}
        run: bash scripts/ensure-state-bucket.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: terraform plan
        working-directory: infra/envs/prod
        env:
          STATE_BUCKET: ${{ steps.state.outputs.bucket }}
          STATE_REGION: ${{ steps.state.outputs.region }}
          OWNER_EMAIL: ${{ secrets.AIC_OWNER_EMAIL }}
          BUDGET: ${{ vars.AIC_MONTHLY_BUDGET_USD || '10000' }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform plan -input=false -out=prod.tfplan \
            -var "region=${AWS_REGION}" \
            -var "owner_email=${OWNER_EMAIL}" \
            -var "agent_image_tag=${IMAGE_TAG}" \
            -var "monthly_budget_usd=${BUDGET}"
          # The full plan goes to this log (where the owner email is masked), not to a downloadable file.
          terraform show -no-color prod.tfplan | tee /tmp/plan.txt
          {
            echo "## Terraform plan"
            grep -E '^Plan:|No changes' /tmp/plan.txt || true
            echo
            echo "The full plan is in the log of the 'terraform plan' step. It is applied next, without approval."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: prod-plan
          include-hidden-files: true
          path: |
            infra/envs/prod/prod.tfplan
            infra/envs/prod/.build
            services/lambdas/dist
          retention-days: 3

  apply:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production # deployment history only; no required reviewers (the owner's choice)
    permissions:
      contents: read
      id-token: write
    outputs:
      hud_bucket: ${{ steps.out.outputs.hud_bucket }}
      distribution_id: ${{ steps.out.outputs.distribution_id }}
      hud_url: ${{ steps.out.outputs.hud_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: prod-plan
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AIC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200 # the first apply builds the image under QEMU; the role allows 2 h
      # The plan builds the ARM64 agent image while it applies (scripts/push-image.sh).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: terraform apply (the reviewed plan, exactly)
        working-directory: infra/envs/prod
        env:
          STATE_BUCKET: ${{ needs.plan.outputs.state_bucket }}
          STATE_REGION: ${{ needs.plan.outputs.state_region }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform apply -input=false prod.tfplan
      - name: outputs for the HUD upload
        id: out
        working-directory: infra/envs/prod
        run: |
          echo "hud_bucket=$(terraform output -raw hud_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "hud_url=$(terraform output -raw hud_url)" >> "$GITHUB_OUTPUT"

  frontend:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @aic/web
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AIC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: upload the HUD (config.json is managed by Terraform) and refresh CloudFront
        env:
          BUCKET: ${{ needs.apply.outputs.hud_bucket }}
          DIST: ${{ needs.apply.outputs.distribution_id }}
          URL: ${{ needs.apply.outputs.hud_url }}
        run: |
          aws s3 sync web/dist "s3://${BUCKET}" --delete --exclude config.json --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/dist/index.html "s3://${BUCKET}/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${DIST}" --paths "/index.html" "/"
          echo "## AI City is deployed: ${URL}" >> "$GITHUB_STEP_SUMMARY"
