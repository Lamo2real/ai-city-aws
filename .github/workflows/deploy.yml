# Deploy prod. Runs automatically on every push to main (the owner's choice: no approval step), and can
# also be started by hand. Docs-only pushes don't deploy. The owner provides:
#   variable VAIC_DEPLOY_ROLE_ARN  an IAM role GitHub can assume through OIDC (trust: docs/deploy-role-trust-policy.json)
#   secret   VAIC_OWNER_EMAIL      the only login (Cognito, admin-created) and where alerts go. A secret, not a
#                                 variable, so it is masked in the logs of this public repository.
# Optional variables: VAIC_REGION (default eu-north-1), VAIC_MONTHLY_BUDGET_USD (alert amount, default 10000),
# VAIC_STATE_BUCKET (default lamo-labs-state-bucket; state key ai-city-aws/prod/terraform.tfstate).
#
# One run deploys from nothing:
#   web      - web tests and the HUD build                         } in parallel
#   backend  - Python lint, types and tests; the Lambda package    }
#   plan     - creates the Terraform state bucket if it is missing, plans.
#   apply    - applies exactly that plan (no approval). The plan builds and pushes the agent image
#              (scripts/push-image.sh) after the ECR repository exists and before the runtimes. The image
#              tag is a hash of the runtime's sources, so pushes that don't touch them don't rebuild it.
#   frontend - uploads the HUD to its bucket and refreshes CloudFront, using Terraform's outputs.
# A push whose commit message contains [skip ci] does not deploy.
name: deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md" # the top folder's only: prompts and skills (agents/**/*.md, skills/**/*.md) are code and must deploy
      - "ios/**" # the iPhone app is built in Xcode, nothing in it deploys
      - ".github/workflows/ios-testflight.yml" # the iPhone app's own pipeline
      - "desktop/**" # the Mac and Windows app has its own pipeline (desktop.yml) and deploys nothing
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.VAIC_REGION || vars.AIC_REGION || 'eu-north-1' }}
  TF_STATE_BUCKET: ${{ vars.VAIC_STATE_BUCKET || vars.AIC_STATE_BUCKET || 'lamo-labs-state-bucket' }}
  TF_STATE_KEY: ai-city-aws/prod/terraform.tfstate
  TF_IN_AUTOMATION: "1"

jobs:
  # ---------- stage 1, in parallel: the web app and the backend are tested and built ----------
  web:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build -w @vaic/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  backend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: lint, types and tests (Python)
        working-directory: backend
        run: |
          uv sync --frozen --all-extras
          uv run ruff check
          uv run mypy
          uv run pytest -q
      - name: build the Lambda package (Python 3.13, arm64)
        run: python3 backend/scripts/build_lambdas.py
      - name: agent image tag (changes only when the runtime's sources change)
        id: image
        run: |
          h="${{ hashFiles('services/agent-runtime/**', 'backend/src/**', 'backend/pyproject.toml', 'backend/uv.lock', 'agents/**', 'config/**') }}"
          echo "tag=rt-${h:0:16}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: backend/dist/lambda
          retention-days: 3

  # ---------- stage 2: plan the infrastructure (Lambdas, runtimes, API, HUD hosting) ----------
  plan:
    needs: [web, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    outputs:
      state_bucket: ${{ steps.state.outputs.bucket }}
      state_region: ${{ steps.state.outputs.region }}
    steps:
      - name: check the repository settings
        env:
          ROLE: ${{ vars.VAIC_DEPLOY_ROLE_ARN || vars.AIC_DEPLOY_ROLE_ARN }}
          EMAIL: ${{ secrets.VAIC_OWNER_EMAIL || secrets.AIC_OWNER_EMAIL }}
        run: |
          ok=1
          [ -n "$ROLE" ] || { echo "::error::Set the variable VAIC_DEPLOY_ROLE_ARN (Settings → Secrets and variables → Actions → Variables)."; ok=0; }
          [ -n "$EMAIL" ] || { echo "::error::Set the secret VAIC_OWNER_EMAIL (Settings → Secrets and variables → Actions → Secrets)."; ok=0; }
          [ "$ok" = 1 ]
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: backend/dist/lambda
      - name: who GitHub says this job is (what the deploy role's trust policy must match)
        run: |
          # Prints only the token's claims, never the token itself.
          curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | python3 -c 'import sys,json,base64; p=json.load(sys.stdin)["value"].split(".")[1]; c=json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4))); print(json.dumps({k:c.get(k) for k in ("sub","aud","repository","ref","environment","job_workflow_ref")}, indent=2))'
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.VAIC_DEPLOY_ROLE_ARN || vars.AIC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform state bucket (created on the first run if missing)
        id: state
        env:
          STATE_BUCKET: ${{ env.TF_STATE_BUCKET }}
        run: bash scripts/ensure-state-bucket.sh
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - name: terraform plan
        working-directory: infra/envs/prod
        env:
          STATE_BUCKET: ${{ steps.state.outputs.bucket }}
          STATE_REGION: ${{ steps.state.outputs.region }}
          OWNER_EMAIL: ${{ secrets.VAIC_OWNER_EMAIL || secrets.AIC_OWNER_EMAIL }}
          BUDGET: ${{ vars.VAIC_MONTHLY_BUDGET_USD || vars.AIC_MONTHLY_BUDGET_USD || '10000' }}
          IMAGE_TAG: ${{ needs.backend.outputs.image_tag }}
          QUEUES_ENABLED: ${{ vars.VAIC_QUEUES_ENABLED || vars.AIC_QUEUES_ENABLED || 'true' }}
          # Optional JSON, e.g. {"google":{"enabled":true,"client_id":"…"},"microsoft":{"enabled":false,"client_id":"","tenant_id":"common"}}
          MAIL_PROVIDERS: ${{ vars.VAIC_MAIL_PROVIDERS || vars.AIC_MAIL_PROVIDERS }}
          # "true" once the owner has pasted the Apple APNs key in Settings (docs/NOTIFICATIONS.md).
          APNS_ENABLED: ${{ vars.VAIC_APNS_ENABLED || vars.AIC_APNS_ENABLED || 'false' }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          extra=()
          [ -z "$MAIL_PROVIDERS" ] || extra+=(-var "mail_providers=${MAIL_PROVIDERS}")
          terraform plan -input=false -out=prod.tfplan \
            -var "region=${AWS_REGION}" \
            -var "owner_email=${OWNER_EMAIL}" \
            -var "agent_image_tag=${IMAGE_TAG}" \
            -var "queues_enabled=${QUEUES_ENABLED}" \
            -var "monthly_budget_usd=${BUDGET}" \
            -var "apns_enabled=${APNS_ENABLED}" \
            "${extra[@]}"
          # The full plan goes to this log (where the owner email is masked), not to a downloadable file.
          terraform show -no-color prod.tfplan | tee /tmp/plan.txt
          {
            echo "## Terraform plan"
            grep -E '^Plan:|No changes' /tmp/plan.txt || true
            echo
            echo "The full plan is in the log of the 'terraform plan' step. It is applied next, without approval."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: prod-plan
          include-hidden-files: true
          path: |
            infra/envs/prod/prod.tfplan
            infra/envs/prod/.build
          retention-days: 3

  # ---------- stage 3: apply exactly that plan (builds and pushes the agent image too) ----------
  apply:
    needs: [backend, plan]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production # deployment history only; no required reviewers (the owner's choice)
    permissions:
      contents: read
      id-token: write
    outputs:
      hud_bucket: ${{ steps.out.outputs.hud_bucket }}
      distribution_id: ${{ steps.out.outputs.distribution_id }}
      hud_url: ${{ steps.out.outputs.hud_url }}
      knowledge_function: ${{ steps.out.outputs.knowledge_function }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: prod-plan
          # The artifact holds prod.tfplan and .build/ relative to infra/envs/prod (their common folder).
          path: infra/envs/prod
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.VAIC_DEPLOY_ROLE_ARN || vars.AIC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7200 # the first apply builds the image under QEMU; the role allows 2 h
      # The plan builds the ARM64 agent image while it applies (scripts/push-image.sh).
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: terraform apply (the reviewed plan, exactly)
        working-directory: infra/envs/prod
        env:
          STATE_BUCKET: ${{ needs.plan.outputs.state_bucket }}
          STATE_REGION: ${{ needs.plan.outputs.state_region }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${STATE_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform apply -input=false prod.tfplan
      - name: warm VAIC's runtime (the first message after a release should be fast too)
        working-directory: infra/envs/prod
        run: |
          fn="$(terraform output -raw scheduler_function_name 2>/dev/null || echo vaic-prod-scheduler)"
          aws lambda invoke --function-name "$fn" --payload '{"job":"warm_vaic"}' \
            --cli-binary-format raw-in-base64-out /dev/null || echo "warm-up skipped"
      - name: fold departments a preset took over ("Apps" into Application, decision 220; idempotent)
        working-directory: infra/envs/prod
        run: |
          fn="$(terraform output -raw scheduler_function_name 2>/dev/null || echo vaic-prod-scheduler)"
          aws lambda invoke --function-name "$fn" --payload '{"job":"merge_departments"}' \
            --cli-binary-format raw-in-base64-out merge.json > merge-invoke.json \
            || { echo "::warning::The department merge was not invoked; the next City load runs it."; exit 0; }
          cat merge.json; echo
          if jq -e 'has("FunctionError")' merge-invoke.json > /dev/null; then
            echo "::warning::The department merge failed; the next City load runs it again."
          fi
      - name: outputs for the HUD upload
        id: out
        working-directory: infra/envs/prod
        run: |
          echo "hud_bucket=$(terraform output -raw hud_bucket)" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "hud_url=$(terraform output -raw hud_url)" >> "$GITHUB_OUTPUT"
          echo "knowledge_function=$(terraform output -json knowledge_function_names | jq -r '.knowledge // empty')" >> "$GITHUB_OUTPUT"
      - name: mail sign-in redirect URIs (register them in Google Cloud / Microsoft Entra)
        working-directory: infra/envs/prod
        run: |
          urls="$(terraform output -json mail_callback_urls)"
          echo "Mail callback URLs: ${urls}"
          { echo "## Mail sign-in redirect URIs"; echo '```'; echo "${urls}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # ---------- stage 4: the HUD ----------
  frontend:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.VAIC_DEPLOY_ROLE_ARN || vars.AIC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: upload the HUD (config.json is managed by Terraform) and refresh CloudFront
        env:
          BUCKET: ${{ needs.apply.outputs.hud_bucket }}
          DIST: ${{ needs.apply.outputs.distribution_id }}
          URL: ${{ needs.apply.outputs.hud_url }}
        run: |
          aws s3 sync web/dist "s3://${BUCKET}" --delete --exclude config.json --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp web/dist/index.html "s3://${BUCKET}/index.html" --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${DIST}" --paths "/index.html" "/"
          echo "## AI City is deployed: ${URL}" >> "$GITHUB_STEP_SUMMARY"

  # ---------- stage 5: the department knowledge bases (docs/KNOWLEDGE.md section 17) ----------
  # Its own job beside the HUD upload: a seeding failure turns the deploy red without holding the HUD back.
  knowledge:
    needs: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.VAIC_DEPLOY_ROLE_ARN || vars.AIC_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: seed the department knowledge bases (docs/KNOWLEDGE.md section 17)
        env:
          FN: ${{ needs.apply.outputs.knowledge_function }}
        run: |
          fn="${FN:-vaic-prod-knowledge}"
          aws lambda invoke --function-name "$fn" --payload '{"action":"seed_knowledge"}' \
            --cli-binary-format raw-in-base64-out --cli-read-timeout 900 seed.json > invoke.json
          cat seed.json; echo
          if jq -e 'has("FunctionError")' invoke.json > /dev/null || ! jq -e '.ok == true' seed.json > /dev/null; then
            echo "::error::Seeding the knowledge bases failed; the report above says why."
            exit 1
          fi
          # Indexing is asynchronous: wait (up to 20 minutes) until no entry is still processing.
          for i in $(seq 1 40); do
            aws lambda invoke --function-name "$fn" --payload '{"action":"seed_status"}' \
              --cli-binary-format raw-in-base64-out status.json > /dev/null
            cat status.json; echo
            if jq -e '.failed > 0' status.json > /dev/null; then
              echo "::error::Some knowledge entries failed to index; the Knowledge tab shows why."
              exit 1
            fi
            if jq -e '.processing == 0' status.json > /dev/null; then break; fi
            if [ "$i" = 40 ]; then
              echo "::error::Knowledge entries were still indexing after 20 minutes."
              exit 1
            fi
            sleep 30
          done
          # The retrieval evaluation on the live hybrid index: printed for the owner, never blocking.
          aws lambda invoke --function-name "$fn" --payload '{"action":"knowledge_eval"}' \
            --cli-binary-format raw-in-base64-out --cli-read-timeout 900 eval.json || true
          jq -c '.probe // empty' eval.json || true
          head -c 4000 eval.json; echo
          jq -r '.results[] | "Retrieval hit rate (\(.department), top \(.k)): \(.hits)/\(.total) = \(.hit_rate), plain fallbacks \(.fallbacks // 0)"' eval.json \
            && jq -c '.results[].misses[]' eval.json || echo "retrieval evaluation skipped"
