<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The iPhone app's City: the web HUD's own scene, no network at all (the app feeds it data). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <title>AI City — City</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #8cc66d; overscroll-behavior: none; }
      #city { position: absolute; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #city canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="city" aria-hidden="true"><canvas></canvas></div>
    <script type="module" src="/src/embed/city-embed.ts"></script>
  </body>
</html>
