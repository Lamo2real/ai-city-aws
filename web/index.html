<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VAIC</title>
    <!-- The owner's eye (decision 169): only its lines, hollow, on no background, and the opposite of the browser:
         black on a light browser, white on a dark one (decision 203). One SVG only: Safari ignores media on icon
         links and put a light tile behind a dark PNG. /favicon.ico (white lines) is for browsers that ask by name. -->
    <link rel="icon" type="image/svg+xml" href="/vaic-eye-auto.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Add to Home Screen (iPhone, Android, desktop Chrome): opens full screen as "VAIC" (docs/DESKTOP.md). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VAIC" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
