<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VAIC</title>
    <!-- The owner's eye (decision 169), at new file names so browsers drop the old cached amber icon (decision 173) -->
    <!-- Only the eye's own lines, on no background, light on a dark browser and dark on a light one (decision 195).
         /favicon.ico exists for browsers that ask for it by name, but is not linked: Safari picked it over the SVG. -->
    <link rel="icon" type="image/svg+xml" href="/vaic-icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/vaic-icon-dark.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="64x64" href="/vaic-icon-light.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
