<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VAIC</title>
    <!-- The owner's eye (decision 169), at new file names so browsers drop the old cached amber icon (decision 173) -->
    <!-- favicon.ico too: Safari asks for /favicon.ico on its own, and a missing one let it keep the old amber icon (decision 193) -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/vaic-icon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/vaic-icon-dark.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/png" sizes="64x64" href="/vaic-icon-light.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
