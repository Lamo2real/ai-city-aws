[project]
name = "aic"
version = "0.2.0"
description = "AI City (AIC) backend: shared core, Lambdas and the AgentCore runtime, in Python."
requires-python = ">=3.13"
dependencies = [
  "boto3>=1.40",
  "httpx>=0.28.1",
  "pillow>=11.2",
  "pydantic>=2.11",
  "pyjwt[crypto]>=2.10",
  "pypdf>=5.4",
  "pyyaml>=6.0.3",
]

[project.optional-dependencies]
# Only the AgentCore runtime image needs these; Lambdas ship without them.
runtime = [
  "aws-sdk-bedrock-runtime>=0.12",  # Nova 2 Sonic's bidirectional stream: AIC's real-time voice (decision 120)
  "claude-agent-sdk>=0.1",
  "starlette>=0.47",
  "uvicorn>=0.35",
  # uvicorn needs a WebSocket library to accept /ws (AIC's real-time voice): without one it treats the upgrade as a
  # plain request, Starlette answers 404 and AgentCore reports 424 (the owner's voice never connected, 2026-11-09).
  "websockets>=15.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
  "mypy>=1.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PL", "ASYNC"]
ignore = [
  "E501",    # the formatter owns line length
  "PLR0917", "UP047",
  "PLC0415", # lazy imports keep runtime-only packages out of the Lambdas
  "PLW0603", # Lambdas cache clients in module globals between warm invocations
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
  "S101",    # asserts are fine in tests and for invariants
  "S603", "S607",
  "RUF001", "RUF002", "RUF003",  # plain-language text uses typographic quotes and arrows
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "PLC0415"]

[tool.mypy]
python_version = "3.13"
packages = ["aic"]
mypy_path = "src"
strict = false
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
